<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Gym Admission Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Gym Admission Form</h2>

    <form id="gymForm">
        <p><label for="name">Full Name</label><br>
        <input type="text" id="name" name="name" placeholder="Enter your full name" autocomplete="off"><br>
        <span id="nameError" class="error"></span></p>

        <p><label for="age">Age</label><br>
        <input type="number" id="age" name="age" placeholder="Enter your age" min="1" max="120"><br>
        <span id="ageError" class="error"></span></p>

        <p><label for="email">Email</label><br>
        <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email"><br>
        <span id="emailError" class="error"></span></p>

        <p><label for="mobile">Mobile Number</label><br>
        <input type="tel" id="mobile" name="mobile" placeholder="10-digit mobile number" maxlength="10"><br>
        <span id="mobileError" class="error"></span></p>

        <p><label for="plan">Membership Plan</label><br>
        <select id="plan" name="plan">
            <option value="">-- Select Plan --</option>
            <option value="monthly">Monthly</option>
            <option value="quarterly">Quarterly</option>
            <option value="yearly">Yearly</option>
        </select><br>
        <span id="planError" class="error"></span></p>

        <button type="submit" id="submitBtn">Join Now</button>

        <p id="result" class="success"></p>
    </form>

    <script src="script.js"></script>
</body>
</html>
