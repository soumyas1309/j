<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Clothing Store - Billing System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Soumya's Clothing Store - Billing System</h1>

    <p><label for="customerName">Customer:</label>
    <input type="text" id="customerName"></p>

    <h3>Add Item</h3>

    <p><label for="brand">Brand</label><br>
    <select id="brand">
        <option value="">-- Select Brand --</option>
        <option value="Nike">Nike</option>
        <option value="Adidas">Adidas</option>
        <option value="Puma">Puma</option>
        <option value="Levi's">Levi's</option>
        <option value="H&M">H&amp;M</option>
        <option value="Zara">Zara</option>
        <option value="Uniqlo">Uniqlo</option>
        <option value="Other">Other (Type Custom)</option>
    </select>
    <input type="text" id="custom-brand" placeholder="Enter Custom Brand" style="display:none;"></p>

    <p><label for="name">Item Type</label><br>
    <select id="name">
        <option value="">-- Select Item --</option>
        <option value="T-Shirt">T-Shirt</option>
        <option value="Jeans">Jeans</option>
        <option value="Shirt">Shirt</option>
        <option value="Shorts">Shorts</option>
        <option value="Jacket">Jacket</option>
        <option value="Sweater">Sweater</option>
        <option value="Dress">Dress</option>
        <option value="Other">Other</option>
    </select></p>

    <p><label for="size">Size</label><br>
    <select id="size">
        <option value="">-- Select Size --</option>
        <option value="S">S (Small)</option>
        <option value="M">M (Medium)</option>
        <option value="L">L (Large)</option>
        <option value="XL">XL (Extra Large)</option>
        <option value="XXL">XXL (Double XL)</option>
        <option value="XXXL">XXXL</option>
    </select></p>

    <p><label for="color">Color</label><br>
    <select id="color">
        <option value="">-- Select Color --</option>
        <option value="Black">Black</option>
        <option value="White">White</option>
        <option value="Blue">Blue</option>
        <option value="Red">Red</option>
        <option value="Green">Green</option>
        <option value="Grey">Grey</option>
        <option value="Navy">Navy</option>
        <option value="Beige">Beige</option>
        <option value="Other">Other</option>
    </select></p>

    <p><label for="price">Price (₹)</label><br>
    <input type="number" id="price" placeholder="0.00" step="0.01"></p>

    <p><label for="qty">Quantity</label><br>
    <input type="number" id="qty" placeholder="1" min="1" value="1"></p>

    <p><label for="gst-rate">GST Rate</label><br>
    <select id="gst-rate">
        <option value="5">5%</option>
        <option value="12">12%</option>
        <option value="18" selected>18%</option>
        <option value="28">28%</option>
    </select></p>

    <button onclick="addItem()">Add to Bill</button>

    <h3>Bill Details</h3>

    <p><label for="discountPercent">Apply Discount (%)</label>
    <input type="number" id="discountPercent" placeholder="%" min="0" max="100" step="0.5"><br>
    Discount applies to subtotal before GST</p>

    <table>
        <thead>
            <tr>
                <th>Description</th>
                <th>Price</th>
                <th>Qty</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="list">
            <tr id="empty"><td colspan="5">No items yet</td></tr>
        </tbody>
    </table>

    <p>Subtotal: <span id="sub">₹0.00</span></p>
    <p id="discount-display">Discount (0%): <span id="disc-val">₹0.00</span></p>
    <p>CGST (Half): <span id="cgst">₹0.00</span></p>
    <p>SGST (Half): <span id="sgst">₹0.00</span></p>
    <p><strong>Grand Total: <span id="final">₹0.00</span></strong></p>

    <button onclick="window.print()" id="printBtn" disabled>Print Bill</button>
    <button onclick="clearBill()">Clear Bill</button>

    <script src="script.js"></script>
</body>
</html>
