<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>JS Practical 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>User Information Form</h1>

    <p><label for="name">Enter Name</label><br>
    <input type="text" id="name"></p>

    <p><label for="age">Enter Age</label><br>
    <input type="number" id="age"></p>

    <p><label for="gender">Select Gender</label><br>
    <select id="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select></p>

    <p><label for="email">Enter Email</label><br>
    <input type="email" id="email"></p>

    <p><label for="mobile">Enter Mobile Number</label><br>
    <input type="tel" id="mobile"></p>

    <p><label for="course">Select Course</label><br>
    <select id="course">
        <option value="">Select Course</option>
        <option>B.Tech</option>
        <option>BCA</option>
        <option>B.Sc</option>
        <option>MCA</option>
    </select></p>

    <p><label for="city">Enter City</label><br>
    <input type="text" id="city"></p>

    <button onclick="showWelcome()">Submit</button>

    <hr>

    <div id="output">
        <p>Result will be displayed here.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
