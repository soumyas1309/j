<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>To-Do List</h1>

    <input type="text" id="taskInput" placeholder="Enter a new task...">
    <button id="addBtn">Add Task</button>

    <p id="taskCount">0 tasks pending</p>

    <ul id="taskList">
    </ul>

    <p id="emptyMessage" class="hidden">Start by adding your first task.</p>

    <script src="script.js"></script>
</body>
</html>
