<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Load JSON using fetch() and jQuery</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <h2>Part 1: Student Details using fetch()</h2>
    <button onclick="loadStudents()">Load Students</button>

    <table id="studentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <hr>

    <h2>Part 2: Student Details using jQuery $.getJSON()</h2>
    <button id="jqLoadBtn">Load Students</button>

    <table id="jqStudentTable">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Department</th>
                <th>Marks</th>
            </tr>
        </thead>
        <tbody id="jqTableBody">
        </tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
